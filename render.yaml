# Refactor Eval Factory runs matrix experiments as Render Workflows tasks.
# Agent code executes in disposable Sandboxes; per-iteration evidence is durable in Postgres.
# Workflows have no pre-deploy step: the experiment task applies the idempotent migrations before it writes.

projects:
  - name: refactor-eval-factory
    environments:
      - name: production
        services:
          - type: workflow
            name: refactor-eval-workflows
            region: oregon
            runtime: node
            repo: https://github.com/jacobprall/refactor-eval-factory
            buildCommand: npm ci
            startCommand: npm run start:workflows
            envVars:
              - fromGroup: refactor-eval-shared
              - fromGroup: refactor-eval-workflows
              - key: DATABASE_URL
                fromDatabase:
                  name: refactor-eval-results
                  property: connectionString
        databases:
          - name: refactor-eval-results
            databaseName: refactor_eval
            user: refactor_eval
            region: oregon
            plan: basic-256mb
