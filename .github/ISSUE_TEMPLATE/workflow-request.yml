name: Coding agent workflow request
description: Propose a new label-triggered coding agent workflow for the factory.
title: "[Workflow]: "
labels: ["workflow-request"]
body:
  - type: markdown
    attributes:
      value: |
        A coding agent workflow starts when someone applies a GitHub label to an issue or pull request. An agent then works in a Sandbox checkout of the repository and reports back on GitHub.

        Describe the workflow you want, not how to build it. Triage reads this issue and the repository, and the spec writer turns both into a specification for you to approve. Answer the product decisions here so Triage doesn't have to ask.

        When the request is ready, apply `factory:triage` to start Triage.

  - type: textarea
    id: outcome
    attributes:
      label: What should the workflow accomplish?
      description: One or two sentences on the result and who it serves.
      placeholder: When a pull request changes the public API, update the API reference docs so they never drift from the code.
    validations:
      required: true

  - type: textarea
    id: current-process
    attributes:
      label: What happens today?
      description: The manual process this replaces, or what goes wrong without it.
      placeholder: Reviewers ask authors to update docs by hand, and about half of API changes ship without them.
    validations:
      required: false

  - type: dropdown
    id: subject
    attributes:
      label: What does the label go on?
      options:
        - An issue
        - A pull request
    validations:
      required: true

  - type: input
    id: label
    attributes:
      label: Trigger label
      description: Leave blank to let the spec choose one.
      placeholder: "factory:docs"
    validations:
      required: false

  - type: textarea
    id: inputs
    attributes:
      label: What should the agent read?
      description: The agent always has the repository checkout and the labeled issue or pull request. List anything else it needs.
      placeholder: |
        - The pull request diff
        - The OpenAPI spec at api/openapi.yaml
    validations:
      required: false

  - type: textarea
    id: behavior
    attributes:
      label: What should it do?
      description: The steps an engineer doing this task by hand would take, in order.
      placeholder: |
        1. Find public API changes in the diff.
        2. Update the matching reference pages under docs/api/.
        3. Run the docs build and fix any errors.
    validations:
      required: true

  - type: dropdown
    id: changes-code
    attributes:
      label: Does it change code?
      options:
        - No. It reads the code and reports findings.
        - Yes. It opens a draft pull request with its changes.
    validations:
      required: true

  - type: checkboxes
    id: outputs
    attributes:
      label: Where should the results go?
      description: Select every output. The factory never approves or merges pull requests.
      options:
        - label: A comment on the issue or pull request
        - label: A specification a person approves before any code changes
        - label: A draft pull request
        - label: A COMMENT review on a pull request
        - label: Labels added or removed

  - type: dropdown
    id: approval
    attributes:
      label: When should a person approve?
      options:
        - Before each stage, with a label per stage (like Triage, then Spec-to-PR)
        - Once up front, then it runs to the end (like factory:autopilot)
        - Never; the trigger label alone starts all of it
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: How should the agent check its work?
      description: Commands that must pass before it reports or publishes. Leave blank to use the repository's configured verify commands.
      placeholder: npm run docs:build
    validations:
      required: false

  - type: textarea
    id: example
    attributes:
      label: Walk through one example
      description: A real or realistic issue or pull request, and exactly what the workflow should produce from it.
      placeholder: |
        Input: PR #142 renames the `limit` query parameter on GET /users to `pageSize`.
        Result: a draft PR that updates docs/api/users.md, with the docs build passing.
    validations:
      required: true

  - type: textarea
    id: success
    attributes:
      label: How will you know it works?
      description: One observable behavior per line. Each line becomes a candidate acceptance criterion.
      placeholder: |
        - A PR that changes no public API gets a comment saying no docs changes are needed.
        - The docs PR passes the docs build.
        - The docs PR links to the source PR.
    validations:
      required: true

  - type: textarea
    id: stop-conditions
    attributes:
      label: When should it stop, ask, or do nothing?
      description: Inputs it should skip, questions it should ask a person, and failures it should report instead of working around.
      placeholder: Skip draft PRs. If a change touches more than 20 endpoints, comment and stop instead of opening a PR.
    validations:
      required: false

  - type: checkboxes
    id: new-capabilities
    attributes:
      label: Does it need any of these?
      description: Each one changes the factory's setup or authority boundary, so flag it early.
      options:
        - label: A new secret or API key
        - label: A new GitHub App permission or webhook event
        - label: Persistent storage, such as a database
        - label: Changes to files under .github/workflows/
        - label: Pushing to a branch the factory didn't create
        - label: Approving or merging pull requests

  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Repositories, model preference, cost or time budget, and expected volume.
      placeholder: |
        - Repositories: acme/web only
        - Budget: under $2 and 15 minutes per run
        - Volume: about 10 runs a week
    validations:
      required: false
